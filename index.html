<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Panel financiero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F4FB6'/%3E%3Cpath d='M9 22V14M16 22V9M23 22V17' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F9FAFB;--line:#E4E7EC;
  --ink:#101828;--ink-2:#344054;--muted:#667085;
  --brand:#1F4FB6;--brand-soft:#EAF1FD;--on-brand:#FFFFFF;
  --pos:#067647;--pos-soft:#ECFDF3;--pos-line:#ABEFC6;
  --neg:#B42318;--neg-soft:#FEF3F2;--neg-line:#FECDCA;
  --warn:#93370D;--warn-soft:#FFFAEB;--warn-line:#FEDF89;
  --info:#1F4FB6;--info-soft:#EFF4FF;--info-line:#C7D7FE;
  --neutral:#475467;--neutral-soft:#F2F4F7;--neutral-line:#D0D5DD;
  --income:#2a78d6;--expense:#e0602b;--profit:#667085;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C111D;--surface:#161B26;--surface-2:#1B212D;--line:#2C313D;
  --ink:#F5F5F6;--ink-2:#CECFD2;--muted:#94969C;
  --brand:#84ADFF;--brand-soft:#1A2A4F;--on-brand:#0C111D;
  --pos:#47CD89;--pos-soft:#0B2A1C;--pos-line:#1B5E3F;
  --neg:#F97066;--neg-soft:#3A1512;--neg-line:#7A271A;
  --warn:#FDB022;--warn-soft:#33240A;--warn-line:#7A5A0E;
  --info:#84ADFF;--info-soft:#15213D;--info-line:#2D4A8A;
  --neutral:#CECFD2;--neutral-soft:#1F242F;--neutral-line:#333741;
  --income:#3987e5;--expense:#e0602b;--profit:#94969C;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ── Login ── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center;margin-bottom:18px}
.logo svg{width:24px;height:24px}
.login-card h1{font-size:1.35rem;margin:0 0 4px}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:.93rem}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--neutral-line);border-radius:var(--radius-sm);background:var(--surface-2)}
.field input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--neutral-line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn-primary{width:100%;background:var(--brand);border-color:var(--brand);color:var(--on-brand);padding:12px 16px;margin-top:6px}
.btn-primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn-primary[disabled]{opacity:.7;cursor:progress}
.err{min-height:1.4em;margin-top:12px;color:var(--neg);font-size:.88rem;font-weight:600}
.login-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;gap:8px;align-items:flex-start}

/* ── App ── */
#app{display:none}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto}
.brand .logo{width:32px;height:32px;margin:0;border-radius:9px}
.brand .logo svg{width:18px;height:18px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters label{font-size:.75rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:2px}
.filters select{padding:6px 8px;border:1px solid var(--neutral-line);border-radius:var(--radius-sm);background:var(--surface-2);min-width:92px}
.icon-btn{width:38px;height:38px;padding:0}
.tabs{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .badge{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--neg-soft);color:var(--neg);font-size:.72rem;border:1px solid var(--neg-line)}
main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}

.ph{margin-bottom:20px}
.ph .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph h2{margin:2px 0 4px;font-size:1.6rem;line-height:1.2}
.ph p{margin:0 0 10px;color:var(--ink-2)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid}
.pill.CONFIRMADO,.pill.COINCIDE{background:var(--pos-soft);color:var(--pos);border-color:var(--pos-line)}
.pill.PARCIAL{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.ESTIMADO{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.pill.REQUIRES_REVIEW,.pill.DIFIERE{background:var(--neg-soft);color:var(--neg);border-color:var(--neg-line)}
.half{width:.8em;height:.8em;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}

.sec{margin:30px 0 12px}
.sec h3{margin:0;font-size:1.1rem}
.sec p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi{border-top:3px solid var(--neutral-line)}
.kpi.income{border-top-color:var(--income)}.kpi.expense{border-top-color:var(--expense)}
.kpi.profit{border-top-color:var(--profit)}.kpi.tax{border-top-color:var(--brand)}.kpi.review{border-top-color:var(--neg)}
.kpi .lbl{font-size:.85rem;font-weight:600;color:var(--ink-2)}
.kpi .tech{font-size:.72rem;color:var(--muted)}
.kpi .val{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
.kpi .what{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.kpi .foot{font-size:.8rem;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

.note{background:var(--info-soft);border:1px solid var(--info-line);border-radius:var(--radius);padding:12px 16px;color:var(--ink);font-size:.93rem}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.note b{font-weight:700}
.ins{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--neutral-line)}
.ins.pos{border-left-color:var(--pos)}.ins.neg{border-left-color:var(--neg)}.ins.warn{border-left-color:var(--warn)}.ins.info{border-left-color:var(--info)}
.ins .ic{font-size:1.05rem;line-height:1.3}
.ins b{display:block;margin-bottom:2px}
.ins span{color:var(--ink-2);font-size:.88rem}

.meter{height:12px;border-radius:99px;background:var(--neutral-soft);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--pos);border-radius:99px}
.meter-lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2);margin-bottom:6px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.income{background:var(--income)}.sw.expense{background:var(--expense)}.sw.profit{background:var(--profit)}
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line)}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .b-income{fill:var(--income)}.chart .b-expense{fill:var(--expense)}
.chart .l-profit{stroke:var(--profit);fill:none;stroke-width:2}
.chart .d-profit{fill:var(--profit);stroke:var(--surface);stroke-width:2}
.chart .inc{fill:var(--warn);font-size:10px;font-weight:600;font-family:var(--font)}

.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:6px 10px;align-items:center;font-size:.86rem}
.hb .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:14px;background:var(--neutral-soft);border-radius:4px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb .t i.income{background:var(--income)}.hb .t i.expense{background:var(--expense)}
.hb .v{text-align:right;font-weight:600}

details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--brand);font-size:.85rem;font-weight:600}
.tw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

.prio{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.prio:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.dot.alta{background:var(--neg)}.dot.media{background:var(--warn)}.dot.baja{background:var(--neutral)}
.prio .n{font-weight:700;font-size:1.1rem}
.prio small{display:block;color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.tag.alta{color:var(--neg)}.tag.media{color:var(--warn)}.tag.baja{color:var(--muted)}

.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.checks li:last-child{border-bottom:0}
.checks .ok{color:var(--pos);font-weight:700}.checks .ko{color:var(--neg);font-weight:700}.checks .inf{color:var(--info);font-weight:700}
.checks small{display:block;color:var(--muted)}
.muted{color:var(--muted)}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.8rem}

@media (max-width:640px){
  html,body{font-size:14px}
  .topbar-in{padding:10px 16px}
  .filters{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .filters select{min-width:0;width:100%}
  .tabs{padding:0 12px}
  main{padding:18px 16px 48px}
  .ph h2{font-size:1.35rem}
  .grid,.grid-2{grid-template-columns:1fr}
  .hb{grid-template-columns:minmax(80px,34%) 1fr auto}
}
@media print{.topbar,.tabs{position:static}}
</style>
</head>

        kpi({ label: "Gastos aprobados", value: String(S.exp.length), accent: "expense" })),
        section("Por tipo de gasto", "Antes de IVA, gastos aprobados."),
        h("div", { class: "card" }, hbars(groupBy(S.exp, "c", CAT), "expense", gas)),
        section("Por proveedor", "Los proveedores aparecen con seudónimo."),
        h("div", { class: "card" }, hbars(groupBy(S.exp, "p").slice(0, 12), "expense", gas),
          tableToggle("Ver los gastos aprobados", [{ t: "Documento" }, { t: "Fecha" }, { t: "Proveedor" }, { t: "Tipo" }, { t: "Base", r: 1 }, { t: "IVA", r: 1 }, { t: "IVA deducible" }],
            S.exp.map(function (d) { return [d.id, d.d || "—", d.p || "—", CAT[d.c] || d.c || "—", eur2(d.b), eur2(d.v), d.ded ? "Sí" : "No"]; }))));
      return out;
    },

    entidades: function (S) {
      function agg(arr) {
        const m = {};
        arr.forEach(function (d) { const k = d.p || "Sin identificar"; m[k] = m[k] || { n: 0, b: 0, t: 0 }; m[k].n++; m[k].b += d.b || 0; m[k].t += d.t || 0; });
        return Object.keys(m).sort(function (a, b) { return m[b].b - m[a].b; }).map(function (k) { return [k, String(m[k].n), eur2(m[k].b), eur2(m[k].t)]; });
      }
      const cols = [{ t: "Seudónimo" }, { t: "Documentos", r: 1 }, { t: "Base", r: 1 }, { t: "Total", r: 1 }];
      return [header("Detalle", "Clientes y proveedores · " + periodLabel(), "¿Con quién trabajo más?", [pill("CONFIRMADO", "Solo documentos aprobados")]),
        note(["Por privacidad, los nombres reales ", B("no están en esta página"), ": cada cliente y proveedor tiene un seudónimo fijo (CLIENTE_001, PROVEEDOR_001…)."]),
        section("Clientes"), h("div", { class: "card" }, S.inv.length ? table(cols, agg(S.inv), "Clientes") : h("p", { class: "muted" }, "Sin facturas aprobadas.")),
        section("Proveedores"), h("div", { class: "card" }, S.exp.length ? table(cols, agg(S.exp), "Proveedores") : h("p", { class: "muted" }, "Sin gastos aprobados."))];
    },

    fiscal: function (S) {
      const ivaRow = fiscal("IVA"), ra = fiscal("REGLA_ANDRES"), m = fiscal("MODELO_130");
      const cobr = sum(S.inv, "v"), ded = sum(S.exp.filter(function (d) { return d.ded; }), "v");
      const st = ivaRow ? ivaRow.status : "REQUIRES_REVIEW";
      const out = [header("Detalle", "Fiscal · " + periodLabel(), "¿Qué obligaciones fiscales debo vigilar?", [pill("ESTIMADO", "Orientativo, no es una declaración")]),
        note([B(D.disclaimer), " Estas cifras ayudan a prever, pero la declaración debe revisarla un gestor."]),
        section("IVA", "El IVA no es beneficio: se cobra a los clientes en nombre de Hacienda y luego se declara."),
        h("div", { class: "grid" },
          kpi({ label: "① IVA cobrado a clientes", tech: "IVA repercutido", value: eur(cobr), accent: "income", status: st === "CONFIRMADO" ? "CONFIRMADO" : "PARCIAL" }),
          kpi({ label: "② IVA de compras deducible", tech: "IVA soportado deducible", value: eur(ded), accent: "expense", status: st === "CONFIRMADO" ? "CONFIRMADO" : "PARCIAL" }),
          kpi({ label: "③ IVA estimado a liquidar (① − ②)", tech: "IVA neto (modelo 303, orientativo)", value: eur(cobr - ded), accent: "tax", status: st,
            foot: ivaRow && ivaRow.res.nota ? ivaRow.res.nota : "" }))];
      if (D.vat_rates.length) out.push(tableToggle("Ver el IVA por tipo (todos los documentos aprobados)", [{ t: "Origen" }, { t: "Tipo de IVA" }, { t: "Documentos", r: 1 }, { t: "Base", r: 1 }, { t: "IVA", r: 1 }],
        D.vat_rates.map(function (r) { return [r.o === "INGRESO" ? "Facturas emitidas" : "Gastos", r.rate.replace(".", ",") + " %", String(r.n), eur2(r.b), eur2(r.v)]; })));
      out.push(section("IRPF", "Dos cálculos distintos que NO deben confundirse."));
      const colA = h("div", { class: "card" }, h("h4", null, "A · Regla proporcionada por Andrés"));
      if (ra) add(colA, [kpi({ label: "Reserva estimada para IRPF", value: eur(+ra.res.irpf_estimado), accent: "tax", status: "ESTIMADO", tech: D.rules.ra_label,
          what: "Beneficio del trimestre (" + eur(+ra.res.beneficio) + ") × " + fmtN.format(+ra.res.rate * 100) + " %.",
          foot: ra.status === "PARCIAL" ? "Provisional: hay gastos pendientes; el beneficio real puede ser menor." : "Regla sencilla para apartar dinero." }),
        h("p", { class: "muted" }, "Es una regla práctica para saber cuánto apartar. No es un cálculo oficial.")]);
      else add(colA, h("p", { class: "muted" }, "Sin cálculo para este periodo. Elige un año y un trimestre."));
      const colB = h("div", { class: "card" }, h("h4", null, "B · Modelo 130 (cálculo fiscal)"));
      if (m) {
        const blocked = m.status === "REQUIRES_REVIEW";
        add(colB, kpi({ label: "Pago fraccionado del trimestre", value: blocked ? "Sin calcular" : eur(+m.res.a_ingresar), accent: "review", status: m.status, tech: D.rules.m130_label,
          what: "20 % del rendimiento acumulado del año, menos retenciones y pagos ya hechos.",
          foot: blocked ? "Cálculo parcial con los datos disponibles: " + eur(+m.res.a_ingresar) + ". No usar hasta completar lo que falta." : "" }));
        if (m.res.reasons && m.res.reasons.length) add(colB, [h("p", null, B("Qué falta para calcularlo:")),
          h("ul", { class: "checks" }, m.res.reasons.map(function (r) { return h("li", null, h("span", { class: "ko", "aria-hidden": "true" }, "✕"), h("span", null, plain130(r))); }))]);
      } else add(colB, h("p", { class: "muted" }, "Sin cálculo para este periodo. Elige un año y un trimestre."));
      out.push(h("div", { class: "grid-2" }, colA, colB));
      out.push(note(["¿En qué se diferencian? La regla de Andrés aplica un 20 % al beneficio de un trimestre. El Modelo 130 usa el beneficio ", B("acumulado desde enero"),
        ", resta las retenciones de las facturas y lo ya pagado en trimestres anteriores. Por eso pueden dar cifras distintas."]));
      const orc = D.fiscal.filter(function (r) { return r.method === "ORACLE_GESTOR_AUTONOMOS" && (!F.y || r.y === F.y) && (!F.q || r.q === F.q); });
      if (orc.length) {
        out.push(section("Verificación independiente", "Los cálculos se comprueban con una segunda herramienta."));
        out.push(h("div", { class: "card" }, h("ul", { class: "checks" }, orc.map(function (r) {
          const ok = r.status === "COINCIDE";
          return h("li", null, h("span", { class: ok ? "ok" : "ko", "aria-hidden": "true" }, ok ? "✓" : "✕"),
            h("span", null, (r.res.method === "IVA" ? "IVA" : "Modelo 130") + " · " + r.y + " T" + r.q, h("small", null, ok ? "Las dos herramientas dan el mismo resultado." : "Las herramientas no coinciden: revisar antes de usar la cifra.")));
        }))));
      }
      return out;
    },

    pendientes: function () {
      const P = D.docs.filter(function (d) { return d.st === "REQUIRES_REVIEW"; });
      const counts = {};
      P.forEach(function (d) { const k = d.r || "Otro"; counts[k] = (counts[k] || 0) + 1; });
      const rows = Object.keys(counts).sort(function (a, b) { return ((PRIO[a] || PRIO.Otro)[2]) - ((PRIO[b] || PRIO.Otro)[2]); });
      const gs = P.filter(function (d) { return d.k === "GASTO"; }).length;
      return [header("Acción", "Pendientes de revisión", "¿Qué falta por solucionar? (todos los periodos)",
        [P.length ? pill("REQUIRES_REVIEW", P.length + " documentos por revisar") : pill("CONFIRMADO", "Nada pendiente")]),
        note(["Esta página es ", B("solo de consulta"), ". Las correcciones se hacen en el panel local del equipo, donde está el documento original."]),
        h("div", { class: "grid" },
          kpi({ label: "Documentos por revisar", value: String(P.length), accent: "review", what: "No cuentan en ninguna cifra hasta aprobarlos." }),
          kpi({ label: "Gastos", value: String(gs), accent: "expense", what: "Mientras no se revisen, el beneficio sale más alto." }),
          kpi({ label: "Facturas de ingreso", value: String(P.length - gs), accent: "income", what: "Mientras no se revisen, la facturación sale más baja." }),
          kpi({ label: "IVA al 0 % por confirmar", value: String(P.filter(function (d) { return d.z; }).length), accent: "tax", what: "Necesitan que el documento justifique el 0 %." })),
        section("Por dónde empezar", "Ordenado por importancia. Cada documento aparece una vez, en su problema principal."),
        h("div", { class: "card" }, rows.map(function (k) {
          const p = PRIO[k] || PRIO.Otro;
          return h("div", { class: "prio" }, h("span", { class: "dot " + p[0], "aria-hidden": "true" }),
            h("div", null, h("b", null, k), h("span", { class: "tag " + p[0] }, "Prioridad " + p[0]), h("small", null, p[1])),
            h("span", { class: "n num" }, String(counts[k])));
        })),
        section("Documentos"),
        h("div", { class: "card" }, table([{ t: "Documento" }, { t: "Tipo" }, { t: "Problema principal" }, { t: "Importe leído", r: 1 }, { t: "Fecha" }],
          P.slice().sort(function (a, b) { return ((PRIO[a.r] || PRIO.Otro)[2] - (PRIO[b.r] || PRIO.Otro)[2]) || a.id.localeCompare(b.id); })
            .map(function (d) { return [d.id, d.k === "GASTO" ? "Gasto" : "Ingreso", d.r || "Otro", d.t == null ? "sin importe" : eur2(d.t), d.d || "—"]; }), "Documentos pendientes"))];
    },

    sistema: function () {
      const I = D.ingest, pii = D.pii, en = D.entities;
      const PII = { PERSON: "Nombres de personas", ORG: "Nombres de empresas", DNI: "DNI", NIE: "NIE", CIF: "CIF", IBAN: "IBAN", BANK_ACCOUNT: "Cuentas bancarias",
        PHONE: "Teléfonos", ADDRESS: "Direcciones", POSTAL_CODE: "Códigos postales", LOCATION: "Lugares", SIGNATURE: "Firmas", EMAIL: "Correos electrónicos" };
      return [header("Sistema", "Sistema y privacidad", "¿De dónde salen estos datos y qué se ha protegido?", [pill("CONFIRMADO", "Sin datos personales en esta página")]),
        section("Procesamiento de documentos", I.last ? "Última lectura: " + I.last : null),
        h("div", { class: "grid" },
          kpi({ label: "PDF leídos", value: String(I.processed), accent: "tax", what: I.ocr_pages + " páginas escaneadas leídas por OCR en el equipo." }),
          kpi({ label: "Documentos detectados", value: String(I.logical), accent: "tax", what: "Algunos PDF contienen varios documentos." }),
          kpi({ label: "Aprobados", value: String(I.approved), accent: "income", status: "CONFIRMADO" }),
          kpi({ label: "Por revisar", value: String(I.review), accent: "review", status: I.review ? "REQUIRES_REVIEW" : "CONFIRMADO" }),
          kpi({ label: "Duplicados descartados", value: String(I.dup), accent: "profit" }),
          kpi({ label: "Errores de lectura", value: String(I.errors), accent: I.errors ? "review" : "income" })),
        section("Datos personales retirados", "Se detectan y eliminan en el equipo antes de guardar nada. Ninguno llega a esta página."),
        h("div", { class: "card" }, table([{ t: "Tipo de dato" }, { t: "Detectados y retirados", r: 1 }],
          Object.keys(pii).sort(function (a, b) { return pii[b] - pii[a]; }).map(function (k) { return [PII[k] || k, fmtN.format(pii[k])]; }), "Datos personales retirados")),
        section("Seudónimos"),
        h("div", { class: "grid" },
          kpi({ label: "Clientes", value: String(en.CLIENTE || 0), what: "Aparecen como CLIENTE_001, CLIENTE_002…" }),
          kpi({ label: "Proveedores", value: String(en.PROVEEDOR || 0), what: "Aparecen como PROVEEDOR_001…" }),
          kpi({ label: "Trabajadores", value: String(en.TRABAJADOR || 0), what: "Aparecen como TRABAJADOR_001…" })),
        section("Cómo se protege esta página"),
        h("div", { class: "card" }, h("ul", { class: "checks" }, [
          ["Datos cifrados con AES‑256‑GCM; la clave se deriva de usuario y contraseña (PBKDF2, 600.000 iteraciones)."],
          ["Se descifra solo en tu navegador y solo en memoria; al cerrar sesión o la pestaña, desaparece."],
          ["La página no se conecta a ningún servidor ni carga nada externo."],
          ["Sin nombres, NIF, direcciones, teléfonos, conceptos ni documentos originales: solo cifras y seudónimos."]
        ].map(function (c) { return h("li", null, h("span", { class: "ok", "aria-hidden": "true" }, "✓"), h("span", null, c[0])); })))];
    }
  };
})();
</script>
</body>
</html>
